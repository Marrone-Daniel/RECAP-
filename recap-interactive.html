  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {

  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {

  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;recap-workflow&#x27;);
      if (!root || root.dataset.ready === &#x27;1&#x27;) return;
      root.dataset.ready = &#x27;1&#x27;;

      const $ = (s) =&gt; root.querySelector(s);
      const $$ = (s) =&gt; Array.from(root.querySelectorAll(s));

      // Reuse the same controls and plots in a compact, linked workspace.
      const inputs = $(&#x27;.rw-inputs&#x27;), results = $(&#x27;.rw-results&#x27;);
      inputs.append($(&#x27;.rw-data-tools&#x27;), $(&#x27;.rw-shape-control&#x27;), $(&#x27;.rw-horizon&#x27;), $(&#x27;.rw-dist-controls&#x27;), $(&#x27;.rw-controls&#x27;), $(&#x27;.rw-flags&#x27;));
      $(&#x27;#rw-workbench&#x27;).after($(&#x27;.rw-data-section&#x27;));
      results.append($(&#x27;.rw-dist-head&#x27;));
      const mobileTabs = document.createElement(&#x27;div&#x27;);
      mobileTabs.className = &#x27;rw-mobile-plots&#x27;;
      mobileTabs.innerHTML = &#x27;&lt;button type=&quot;button&quot; class=&quot;btn btn-ghost&quot; data-plot=&quot;value&quot; aria-pressed=&quot;true&quot;&gt;价值分布&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;btn btn-ghost&quot; data-plot=&quot;advantage&quot; aria-pressed=&quot;false&quot;&gt;优势判别&lt;/button&gt;&#x27;;
      results.append(mobileTabs);
      const context = document.createElement(&#x27;div&#x27;);
      context.id = &#x27;rw-live-context&#x27;; context.className = &#x27;rw-live-context text-small&#x27;; context.setAttribute(&#x27;aria-live&#x27;,&#x27;polite&#x27;);
      results.append(context, $(&#x27;.rw-dist-chart&#x27;), $(&#x27;.rw-binary-row&#x27;));
      const sampleTools = document.createElement(&#x27;div&#x27;);
      sampleTools.className = &#x27;rw-mini-controls&#x27;;
      sampleTools.innerHTML = &#x27;&lt;button type=&quot;button&quot; id=&quot;rw-reload-sample&quot; class=&quot;btn btn-ghost&quot;&gt;恢复所选样本&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;rw-explain-local&quot; class=&quot;btn btn-ghost&quot;&gt;解释当前判别&lt;/button&gt;&#x27;;
      inputs.querySelector(&#x27;.rw-dist-controls&#x27;).after(sampleTools);
      const help = document.createElement(&#x27;details&#x27;);
      help.className = &#x27;rw-help&#x27;; help.id = &#x27;rw-local-help&#x27;;
      help.innerHTML = &#x27;&lt;summary&gt;当前判别与模拟说明&lt;/summary&gt;&lt;p id=&quot;rw-local-explanation&quot; class=&quot;text-small&quot;&gt;&lt;/p&gt;&lt;p class=&quot;text-small text-muted&quot;&gt;这里的曲线、价值预测及优势参考分布为教学设定，不是训练所得。阈值由示意正态分布的分位数计算；真实实验应使用任务数据中的优势分布。终局成功标签与局部优势条件含义不同。&lt;/p&gt;&#x27;;
      results.append(help);
      $(&#x27;.rw-dist-section&#x27;).remove();
      $(&#x27;#rw-explain&#x27;).remove();
      $$(&#x27;.rw-mobile-plots button&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        results.dataset.mobilePlot = button.dataset.plot;
        $$(&#x27;.rw-mobile-plots button&#x27;).forEach(b =&gt; b.setAttribute(&#x27;aria-pressed&#x27;, String(b === button)));
      }));

      const defaults = {
        source: &#x27;mixed&#x27;, success: 60, intervention: 30, positive: 40,
        correctionsPositive: true, includeFailures: true, repeat: true, stage: 4,
        currentValue: -65, futureValue: -42, shortReward: -10,
        uncertainty: 9, sampleType: &#x27;autonomous&#x27;,
        episodes: 100, rounds: 3, simRound: 1,
        trajectoryType: &#x27;correction&#x27;, selectedStep: 4, sampleEdited: false, horizon: 50,
        distributionShape: &#x27;normal&#x27;, theme: &#x27;dark&#x27;
      };
      let saved = {};
      try {
        saved = (window.openai &amp;&amp; window.openai.widgetState &amp;&amp; window.openai.widgetState.modelContent) || {};
      } catch (_) {}
      let state = { ...defaults, ...(saved &amp;&amp; saved.recapWorkflow ? saved.recapWorkflow : {}) };
      let simulationTimer = null;

      const stageDetails = [
        [&#x27;① 目标任务初始化&#x27;, &#x27;用目标任务示教数据做监督微调，得到第一版采集策略；这一阶段还没有使用新采集的自主经验。&#x27;],
        [&#x27;② 真机部署采集&#x27;, &#x27;策略在真机上自主执行，记录整段观察、动作和终局成功标签；可由专家在关键时刻接管纠正。&#x27;],
        [&#x27;③ 累计轨迹数据集&#x27;, &#x27;把自主成功、失败和接管轨迹与历史数据合并。这里是 DAgger 式数据聚合与自主经验进入同一数据池的位置。&#x27;],
        [&#x27;④ 训练价值函数&#x27;, &#x27;根据完整轨迹回报训练分布式价值函数：成功轨迹对应剩余完成步数，失败轨迹得到显著更低的回报。&#x27;],
        [&#x27;⑤ 计算 Advantage&#x27;, &#x27;用短期奖励、未来价值与当前价值计算动作片段的优势，并按阈值转换为 positive / negative 条件。&#x27;],
        [&#x27;⑥ 更新动作策略&#x27;, &#x27;在同一动作生成模型中同时学习正、负优势数据；条件告诉模型动作属于哪种质量，而不是简单删除所有负样本。&#x27;],
        [&#x27;⑦ 部署改进策略&#x27;, &#x27;部署时请求 “Advantage: positive” 来生成高优势动作。若继续迭代，再收集下一轮自主执行与接管经验。&#x27;]
      ];

      const sampleTimes = [0, 15, 30, 45, 60, 75, 90, 100];
      const trajectorySpecs = {
        success: {
          label: &#x27;完整自主成功&#x27;, outcome: &#x27;success = 1&#x27;, terminal: &#x27;成功&#x27;,
          values: [-0.96, -0.82, -0.72, -0.52, -0.45, -0.28, -0.12, 0]
        },
        failure: {
          label: &#x27;自主执行失败&#x27;, outcome: &#x27;success = 0&#x27;, terminal: &#x27;失败&#x27;,
          values: [-0.75, -0.70, -0.68, -0.72, -0.80, -0.88, -0.94, -1]
        },
        correction: {
          label: &#x27;第 60 步人工接管并成功&#x27;, outcome: &#x27;success = 1&#x27;, terminal: &#x27;成功&#x27;,
          values: [-0.86, -0.74, -0.63, -0.60, -0.66, -0.45, -0.18, 0]
        }
      };

      function clampState() {
        state.success = Math.max(0, Math.min(100, Number(state.success) || 0));
        state.intervention = Math.max(0, Math.min(100, Number(state.intervention) || 0));
        state.positive = Math.max(5, Math.min(95, Number(state.positive) || 40));
        state.stage = Math.max(0, Math.min(6, Number(state.stage) || 0));
        state.currentValue = Math.max(-100, Math.min(0, Number(state.currentValue)));
        state.futureValue = Math.max(-100, Math.min(0, Number(state.futureValue)));
        state.shortReward = Math.max(-100, Math.min(0, Number(state.shortReward)));
        state.uncertainty = Math.max(3, Math.min(22, Number(state.uncertainty) || 9));
        state.sampleType = state.sampleType === &#x27;correction&#x27; ? &#x27;correction&#x27; : &#x27;autonomous&#x27;;
        state.trajectoryType = [&#x27;success&#x27;, &#x27;failure&#x27;, &#x27;correction&#x27;].includes(state.trajectoryType) ? state.trajectoryType : &#x27;correction&#x27;;
        state.selectedStep = Math.max(0, Math.min(sampleTimes.length - 1, Number(state.selectedStep) || 0));
        state.horizon = Math.max(1, Math.min(100, Math.round(Number(state.horizon) || 50)));
        state.distributionShape = [&#x27;normal&#x27;, &#x27;narrow&#x27;, &#x27;wide&#x27;, &#x27;left-tail&#x27;, &#x27;right-tail&#x27;, &#x27;bimodal&#x27;, &#x27;uniform&#x27;].includes(state.distributionShape) ? state.distributionShape : &#x27;normal&#x27;;
        state.theme = state.theme === &#x27;light&#x27; ? &#x27;light&#x27; : &#x27;dark&#x27;;
        state.episodes = Math.max(20, Math.min(500, Number(state.episodes) || 100));
        state.rounds = Math.max(1, Math.min(6, Number(state.rounds) || 3));
        state.simRound = Math.max(1, Math.min(state.rounds, Number(state.simRound) || 1));
        if (state.source === &#x27;autonomous&#x27;) state.intervention = 0;
        if (state.source === &#x27;correction&#x27; &amp;&amp; state.intervention &lt; 50) state.intervention = 50;
      }

      function fmt(value) {
        const n = Number(value);
        const sign = n &gt; 0 ? &#x27;+&#x27; : n &lt; 0 ? &#x27;−&#x27; : &#x27;&#x27;;
        return sign + Math.abs(n).toFixed(2);
      }

      function erf(x) {
        const sign = x &lt; 0 ? -1 : 1;
        const a = Math.abs(x);
        const t = 1 / (1 + 0.3275911 * a);
        const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-a * a);
        return sign * y;
      }

      function normalCdf(x) {
        return 0.5 * (1 + erf(x / Math.sqrt(2)));
      }

      function normalQuantile(p) {
        let lo = -4.5;
        let hi = 4.5;
        for (let i = 0; i &lt; 42; i += 1) {
          const mid = (lo + hi) / 2;
          if (normalCdf(mid) &lt; p) lo = mid;
          else hi = mid;
        }
        return (lo + hi) / 2;
      }

      const shapeProfiles = new Map();
      function valueDistribution(targetMean, scale, shape) {
        const bins = Array.from({ length: 201 }, (_, i) =&gt; -1 + i / 200);
        const probabilities = Array(201).fill(0);
        const target = Math.max(-1, Math.min(0, targetMean));
        if (target === -1 || target === 0) {
          probabilities[target === -1 ? 0 : 200] = 1;
        } else {
          if (!shapeProfiles.has(shape)) {
            const gaussian = (u, center, width) =&gt; Math.exp(-0.5 * ((u - center) / width) ** 2);
            const samples = Array.from({ length: 2001 }, (_, i) =&gt; {
              const u = -1 + i / 1000;
              let weight;
              switch (shape) {
                case &#x27;narrow&#x27;: weight = gaussian(u, 0, 0.12); break;
                case &#x27;wide&#x27;: weight = gaussian(u, 0, 0.60); break;
                case &#x27;left-tail&#x27;: weight = Math.exp(u &lt; 0 ? u / 0.50 : -u / 0.16); break;
                case &#x27;right-tail&#x27;: weight = Math.exp(u &lt; 0 ? u / 0.16 : -u / 0.50); break;
                case &#x27;bimodal&#x27;: weight = gaussian(u, -0.50, 0.12) + gaussian(u, 0.50, 0.12); break;
                case &#x27;uniform&#x27;: weight = 1; break;
                default: weight = gaussian(u, 0, 0.30);
              }
              return { u, weight };
            });
            const sum = samples.reduce((total, item) =&gt; total + item.weight, 0);
            samples.forEach(item =&gt; { item.weight /= sum; });
            const mean = samples.reduce((total, item) =&gt; total + item.u * item.weight, 0);
            shapeProfiles.set(shape, { samples, mean });
          }
          const profile = shapeProfiles.get(shape);
          // Center each shape at the requested expectation and compress its
          // support only when necessary to stay within [-1, 0]. Splitting mass
          // between adjacent bins preserves both normalization and first moment.
          const stretch = Math.min(scale / 0.30,
            (target + 1) / (1 + profile.mean), -target / (1 - profile.mean));
          profile.samples.forEach(({ u, weight }) =&gt; {
            const value = target + stretch * (u - profile.mean);
            const position = Math.max(0, Math.min(200, (value + 1) * 200));
            const lower = Math.floor(position), upper = Math.min(200, lower + 1);
            const fraction = position - lower;
            probabilities[lower] += weight * (1 - fraction);
            probabilities[upper] += weight * fraction;
          });
        }
        const sum = probabilities.reduce((a, b) =&gt; a + b, 0);
        probabilities.forEach((p, i) =&gt; { probabilities[i] = p / sum; });
        const mean = probabilities.reduce((total, p, i) =&gt; total + p * bins[i], 0);
        const variance = probabilities.reduce((total, p, i) =&gt; total + p * (bins[i] - mean) ** 2, 0);
        return { bins, probabilities, mean, standardDeviation: Math.sqrt(variance), peak: Math.max(...probabilities) };
      }

      function probabilityPath(distribution, ceiling) {
        const points = distribution.bins.map((value, i) =&gt; {
          const x = 56 + (value + 1) * 414;
          const y = 230 - distribution.probabilities[i] / ceiling * 159.6;
          return `${x.toFixed(3)} ${y.toFixed(3)}`;
        });
        return &#x27;M 56 230 L &#x27; + points.join(&#x27; L &#x27;) + &#x27; L 470 230 Z&#x27;;
      }

      function densityPath(mean, sigma, xMin, xMax, left, right, top, bottom) {
        const points = [];
        const steps = 160;
        for (let i = 0; i &lt;= steps; i += 1) {
          const value = xMin + (xMax - xMin) * i / steps;
          const density = Math.exp(-0.5 * Math.pow((value - mean) / sigma, 2));
          const x = left + (right - left) * (value - xMin) / (xMax - xMin);
          const y = bottom - density * (bottom - top) * 0.84;
          points.push([x, y]);
        }
        return `M ${left} ${bottom} L ` + points.map((p) =&gt; `${p[0].toFixed(2)} ${p[1].toFixed(2)}`).join(&#x27; L &#x27;) + ` L ${right} ${bottom} Z`;
      }

      function scaleX(value, min, max, left, right) {
        const clipped = Math.max(min, Math.min(max, value));
        return left + (right - left) * (clipped - min) / (max - min);
      }

      function trajectoryRows(type) {
        const spec = trajectorySpecs[type];
        return sampleTimes.map((time, index) =&gt; {
          const futureTime = Math.min(100, time + state.horizon);
          const j = sampleTimes.findIndex((candidate) =&gt; candidate &gt;= futureTime);
          const lo = Math.max(0, j - 1);
          const weight = j === lo ? 0 : (futureTime - sampleTimes[lo]) / (sampleTimes[j] - sampleTimes[lo]);
          const controller = type === &#x27;correction&#x27; &amp;&amp; time &gt;= 60 ? &#x27;人工&#x27; : &#x27;机器人&#x27;;
          const returnTarget = type === &#x27;failure&#x27; ? -1 : -(100 - time) / 100;
          let shortReward = -(futureTime - time) / 100;
          if (type === &#x27;failure&#x27; &amp;&amp; futureTime === 100 &amp;&amp; time &lt; 100) shortReward = -1;
          const currentValue = spec.values[index];
          // Interpolate the synthetic value anchors at the exact t+N endpoint.
          // On a failed terminal transition the penalty is in the reward already,
          // so use zero bootstrap rather than counting the penalty twice.
          const futureValue = type === &#x27;failure&#x27; &amp;&amp; futureTime === 100 ? 0
            : Math.round((spec.values[lo] + weight * (spec.values[j] - spec.values[lo])) * 100) / 100;
          const advantage = shortReward + futureValue - currentValue;
          const threshold = 0.22 * normalQuantile(1 - state.positive / 100);
          const forced = controller === &#x27;人工&#x27; &amp;&amp; state.correctionsPositive;
          const positive = forced || advantage &gt;= threshold;
          return { time, futureTime, controller, returnTarget, shortReward, currentValue, futureValue, advantage, threshold, forced, positive };
        });
      }

      function loadSelectedDataSample(index) {
        state.selectedStep = Math.max(0, Math.min(sampleTimes.length - 1, Number(index) || 0));
        const row = trajectoryRows(state.trajectoryType)[state.selectedStep];
        state.currentValue = Math.round(row.currentValue * 100);
        state.futureValue = Math.round(row.futureValue * 100);
        state.shortReward = Math.round(row.shortReward * 100);
        state.sampleType = row.controller === &#x27;人工&#x27; ? &#x27;correction&#x27; : &#x27;autonomous&#x27;;
        state.sampleEdited = false;
      }

      function renderDataMicroscope() {
        const spec = trajectorySpecs[state.trajectoryType];
        const rows = trajectoryRows(state.trajectoryType);
        const selected = rows[state.selectedStep];
        const hasRaw = state.stage &gt;= 1;
        const hasReturn = state.stage &gt;= 2;
        const hasValue = state.stage &gt;= 3;
        const hasDecision = state.stage &gt;= 4;
        const stageNotes = [
          &#x27;初始化阶段：尚未采集新轨迹。&#x27;,
          &#x27;采集阶段：只记录观察、实际动作、控制者与整段是否成功。&#x27;,
          &#x27;数据聚合后：由终局成功标签为各时刻生成归一化回报 Gₜ。&#x27;,
          &#x27;价值训练后：模型输出 201 桶概率分布，取期望得到 Vφ(oₜ)。&#x27;,
          &#x27;优势计算后：用短期回报和前后价值求 Aₜ，再按阈值二值化。&#x27;,
          &#x27;策略更新阶段：Iₜ 作为条件，与动作片段一起监督动作策略。&#x27;,
          &#x27;部署阶段：请求 positive 条件生成动作；表中标签来自上一轮训练。&#x27;
        ];
        const chain = [
          [&#x27;原始轨迹&#x27;, hasRaw], [&#x27;回报 Gₜ&#x27;, hasReturn], [&#x27;分布 pφ(V)&#x27;, hasValue],
          [&#x27;期望 Vφ&#x27;, hasValue], [&#x27;优势 Aₜ&#x27;, hasDecision], [&#x27;条件 Iₜ&#x27;, hasDecision]
        ];
        $(&#x27;#rw-trajectory-type&#x27;).value = state.trajectoryType;
        $(&#x27;#rw-selected-step&#x27;).value = state.selectedStep;
        $(&#x27;#rw-selected-step-label&#x27;).textContent = `t = ${selected.time}`;
        $(&#x27;#rw-packet-title&#x27;).textContent = `t = ${selected.time} 的原始样本`;
        $(&#x27;#rw-controller-badge&#x27;).textContent = selected.controller === &#x27;人工&#x27; ? &#x27;人工控制&#x27; : &#x27;机器人控制&#x27;;
        $(&#x27;#rw-observation-field&#x27;).textContent = hasRaw ? &#x27;3 路相机图像 + 机器人状态 qₜ&#x27; : &#x27;待真机采集&#x27;;
        $(&#x27;#rw-action-field&#x27;).textContent = hasRaw ? `动作窗口 t=${selected.time} → ${selected.futureTime}；记录实际执行动作` : &#x27;待真机采集&#x27;;
        $(&#x27;#rw-outcome-field&#x27;).textContent = hasRaw ? `episode ${spec.outcome}` : &#x27;待 episode 结束&#x27;;
        $(&#x27;#rw-data-chain&#x27;).innerHTML = chain.map((item, i) =&gt; {
          const step = `&lt;span class=&quot;rw-chain-step${item[1] ? &#x27; ready&#x27; : &#x27;&#x27;}&quot;&gt;${item[1] ? item[0] : item[0] + &#x27; · 待生成&#x27;}&lt;/span&gt;`;
          return i &lt; chain.length - 1 ? step + &#x27;&lt;span class=&quot;rw-chain-arrow&quot;&gt;→&lt;/span&gt;&#x27; : step;
        }).join(&#x27;&#x27;);
        $(&#x27;#rw-stage-note&#x27;).textContent = stageNotes[state.stage];

        $(&#x27;#rw-data-table-body&#x27;).innerHTML = rows.map((row, index) =&gt; {
          const selectedClass = index === state.selectedStep ? &#x27; class=&quot;rw-selected-row&quot;&#x27; : &#x27;&#x27;;
          const controller = hasRaw ? row.controller : &#x27;—&#x27;;
          const terminal = hasRaw ? spec.terminal : &#x27;—&#x27;;
          const returnText = hasReturn ? fmt(row.returnTarget) : &#x27;待生成&#x27;;
          const valueText = hasValue ? fmt(row.currentValue) : &#x27;待训练&#x27;;
          const advantageText = hasDecision ? fmt(row.advantage) : &#x27;待计算&#x27;;
          const binaryText = row.time === 100 ? &#x27;终点，无动作片段&#x27; : hasDecision ? `${row.positive ? &#x27;positive · 1&#x27; : &#x27;negative · 0&#x27;}${row.forced ? &#x27;（纠正覆盖）&#x27; : &#x27;&#x27;}` : &#x27;待判别&#x27;;
          const binaryClass = hasDecision ? (row.positive ? &#x27;rw-cell-positive&#x27; : &#x27;rw-cell-negative&#x27;) : &#x27;rw-cell-pending&#x27;;
          return `&lt;tr${selectedClass}&gt;
            &lt;td&gt;&lt;button type=&quot;button&quot; class=&quot;btn btn-ghost rw-step-button&quot; data-sample-index=&quot;${index}&quot; aria-pressed=&quot;${index === state.selectedStep}&quot;&gt;t=${row.time}&lt;/button&gt;&lt;/td&gt;
            &lt;td&gt;${controller}&lt;/td&gt;&lt;td&gt;${terminal}&lt;/td&gt;
            &lt;td class=&quot;${hasReturn ? &#x27;&#x27; : &#x27;rw-cell-pending&#x27;} tabular-nums&quot;&gt;${returnText}&lt;/td&gt;
            &lt;td class=&quot;${hasValue ? &#x27;&#x27; : &#x27;rw-cell-pending&#x27;} tabular-nums&quot;&gt;${valueText}&lt;/td&gt;
            &lt;td class=&quot;${hasDecision ? &#x27;&#x27; : &#x27;rw-cell-pending&#x27;} tabular-nums&quot;&gt;${row.time === 100 ? &#x27;—&#x27; : advantageText}&lt;/td&gt;
            &lt;td class=&quot;${binaryClass}&quot;&gt;${binaryText}&lt;/td&gt;
          &lt;/tr&gt;`;
        }).join(&#x27;&#x27;);
      }

      function persist() {
        if (!window.openai || !window.openai.setWidgetState) return;
        window.openai.setWidgetState({
          modelContent: { recapWorkflow: state },
          privateContent: { selectedStage: state.stage }
        }).catch(() =&gt; {});
      }

      function render() {
        clampState();
        if (document.documentElement.dataset.recapTheme !== state.theme) {
          document.documentElement.dataset.recapTheme = state.theme;
          window.parent.postMessage({ type: &#x27;recap-theme&#x27;, theme: state.theme }, &#x27;*&#x27;);
        }
        $(&#x27;#rw-theme-toggle&#x27;).textContent = state.theme === &#x27;dark&#x27; ? &#x27;切换日间&#x27; : &#x27;切换夜间&#x27;;
        $(&#x27;#rw-theme-toggle&#x27;).setAttribute(&#x27;aria-pressed&#x27;, String(state.theme === &#x27;dark&#x27;));
        $(&#x27;#rw-distribution-shape&#x27;).value = state.distributionShape;
        const selectedTime = sampleTimes[state.selectedStep];
        const endpoint = Math.min(100, selectedTime + state.horizon);
        const effectiveN = endpoint - selectedTime;
        $(&#x27;#rw-horizon&#x27;).value = state.horizon;
        $(&#x27;#rw-horizon-number&#x27;).value = state.horizon;
        $(&#x27;#rw-horizon-label&#x27;).textContent = `${state.horizon} 步`;
        $(&#x27;#rw-horizon-detail&#x27;).textContent = `t=${selectedTime} → ${endpoint}，实际 n=${effectiveN}` + (effectiveN &lt; state.horizon ? &#x27;（到达轨迹终点，截短窗口）&#x27; : &#x27;&#x27;) + &#x27;。调整 N 会重新载入样本数值。&#x27;;
        $(&#x27;#rw-source&#x27;).value = state.source;
        $(&#x27;#rw-success&#x27;).value = state.success;
        $(&#x27;#rw-intervention&#x27;).value = state.intervention;
        $(&#x27;#rw-positive&#x27;).value = state.positive;
        $(&#x27;#rw-corrections-positive&#x27;).checked = !!state.correctionsPositive;
        $(&#x27;#rw-include-failures&#x27;).checked = !!state.includeFailures;
        $(&#x27;#rw-repeat&#x27;).checked = !!state.repeat;
        $(&#x27;#rw-success-value&#x27;).textContent = state.success + &#x27;%&#x27;;
        $(&#x27;#rw-intervention-value&#x27;).textContent = state.intervention + &#x27;%&#x27;;
        $(&#x27;#rw-positive-value&#x27;).textContent = state.positive + &#x27;%&#x27;;
        $(&#x27;#rw-episodes&#x27;).value = state.episodes;
        $(&#x27;#rw-rounds&#x27;).value = state.rounds;
        $(&#x27;#rw-episodes-value&#x27;).textContent = state.episodes + &#x27; 条&#x27;;
        $(&#x27;#rw-rounds-value&#x27;).textContent = state.rounds + &#x27; 轮&#x27;;

        const currentRoundCollected = state.stage &gt;= 2 ? 1 : 0;
        const collectedRounds = Math.max(0, state.simRound - 1 + currentRoundCollected);
        const collectedEpisodes = collectedRounds * state.episodes;
        const successfulEpisodes = Math.round(collectedEpisodes * state.success / 100);
        const correctedEpisodes = Math.round(collectedEpisodes * state.intervention / 100);
        const retainedFailures = state.includeFailures ? Math.max(0, collectedEpisodes - successfulEpisodes) : 0;
        const policyVersion = Math.max(0, state.simRound - 1 + (state.stage &gt;= 6 ? 1 : 0));
        const valueVersion = Math.max(0, state.simRound - 1 + (state.stage &gt;= 4 ? 1 : 0));
        const totalSimSteps = state.rounds * 6;
        const completedSimSteps = Math.min(totalSimSteps, (state.simRound - 1) * 6 + Math.max(0, state.stage));
        const progress = Math.round(100 * completedSimSteps / totalSimSteps);
        $(&#x27;#rw-round-status&#x27;).textContent = `第 ${state.simRound} / ${state.rounds} 轮`;
        $(&#x27;#rw-policy-version&#x27;).textContent = `执行策略 π${policyVersion === 0 ? &#x27;⁰&#x27; : &#x27;^&#x27; + policyVersion}`;
        $(&#x27;#rw-value-version&#x27;).textContent = `价值模型 V${valueVersion === 0 ? &#x27;⁰&#x27; : &#x27;^&#x27; + valueVersion}`;
        $(&#x27;#rw-data-status&#x27;).textContent = state.stage === 1
          ? `正在采集本轮 ${state.episodes} 条轨迹`
          : `累计 ${collectedEpisodes} 条：成功 ${successfulEpisodes}，纠正 ${correctedEpisodes}，保留失败 ${retainedFailures}`;
        $(&#x27;#rw-label-status&#x27;).textContent = state.stage &gt;= 5
          ? `本轮前 ${state.positive}% 标正${state.correctionsPositive ? &#x27;；纠正片段另强制为正&#x27; : &#x27;&#x27;}`
          : &#x27;本轮优势标签尚未生成&#x27;;
        $(&#x27;#rw-sim-progress&#x27;).setAttribute(&#x27;aria-valuenow&#x27;, progress);
        $(&#x27;#rw-sim-progress-bar&#x27;).style.width = progress + &#x27;%&#x27;;
        $(&#x27;#rw-run&#x27;).textContent = simulationTimer ? &#x27;暂停模拟&#x27; : (state.stage === 6 &amp;&amp; state.simRound === state.rounds ? &#x27;重新模拟&#x27; : &#x27;自动模拟&#x27;);

        const sourceLabel = state.source === &#x27;autonomous&#x27; ? &#x27;仅自主执行&#x27; : state.source === &#x27;correction&#x27; ? &#x27;以人工接管为主&#x27; : &#x27;自主执行 + 人工接管&#x27;;
        $(&#x27;#rw-collect-line1&#x27;).textContent = sourceLabel;
        const total = 124;
        const successW = total * state.success / 100;
        const failureW = state.includeFailures ? total - successW : 0;
        $(&#x27;#rw-success-bar&#x27;).setAttribute(&#x27;width&#x27;, successW);
        $(&#x27;#rw-failure-bar&#x27;).setAttribute(&#x27;x&#x27;, 450 + successW);
        $(&#x27;#rw-failure-bar&#x27;).setAttribute(&#x27;width&#x27;, failureW);
        $(&#x27;#rw-failure-bar&#x27;).style.display = state.includeFailures ? &#x27;&#x27; : &#x27;none&#x27;;
        $(&#x27;#rw-correction-bar&#x27;).setAttribute(&#x27;width&#x27;, total * state.intervention / 100);
        $(&#x27;#rw-correction-bar&#x27;).style.display = state.intervention &gt; 0 ? &#x27;&#x27; : &#x27;none&#x27;;
        $(&#x27;#rw-dataset-caption&#x27;).textContent = state.includeFailures ? &#x27;成功、失败与历史数据累计&#x27; : &#x27;失败轨迹不进入策略训练&#x27;;
        $(&#x27;#rw-positive-label&#x27;).textContent = &#x27;前 &#x27; + state.positive + &#x27;% → positive&#x27;;
        $(&#x27;#rw-correction-label&#x27;).textContent = state.correctionsPositive ? &#x27;纠正动作强制 positive&#x27; : &#x27;纠正动作按价值评估&#x27;;
        $(&#x27;#rw-loop-label&#x27;).textContent = state.repeat ? &#x27;进入下一轮&#x27; : &#x27;结束并评估&#x27;;
        $(&#x27;#rw-loop-path&#x27;).style.display = state.repeat ? &#x27;&#x27; : &#x27;none&#x27;;

        const retained = state.includeFailures ? 100 : state.success;
        $(&#x27;#rw-policy-data&#x27;).textContent = retained + &#x27;%&#x27;;
        $(&#x27;#rw-policy-detail&#x27;).textContent = state.includeFailures ? &#x27;正负优势都保留，用条件区分&#x27; : &#x27;仅保留成功轨迹，难分离 RECAP 与筛选收益&#x27;;
        $(&#x27;#rw-return-mode&#x27;).textContent = state.success === 100 ? &#x27;成功回报&#x27; : state.success === 0 ? &#x27;失败回报&#x27; : &#x27;混合回报&#x27;;
        $(&#x27;#rw-return-detail&#x27;).textContent = state.success === 100 ? &#x27;主要学习完成速度，缺少失败对比&#x27; : state.success === 0 ? &#x27;只有失败信号，缺少成功目标&#x27; : &#x27;成功：剩余步数；失败：大负回报&#x27;;

        renderDataMicroscope();

        $(&#x27;#rw-current-value&#x27;).value = state.currentValue;
        $(&#x27;#rw-future-value&#x27;).value = state.futureValue;
        $(&#x27;#rw-short-reward&#x27;).value = state.shortReward;
        $(&#x27;#rw-uncertainty&#x27;).value = state.uncertainty;
        $(&#x27;#rw-sample-type&#x27;).value = state.sampleType;
        const currentDistribution = valueDistribution(state.currentValue / 100, state.uncertainty / 100, state.distributionShape);
        const futureDistribution = valueDistribution(state.futureValue / 100, state.uncertainty / 100, state.distributionShape);
        const currentV = currentDistribution.mean;
        const futureV = futureDistribution.mean;
        const shortR = state.shortReward / 100;
        const sigma = state.uncertainty / 100;
        const advantage = shortR + futureV - currentV;
        const advantageSigma = 0.22;
        const threshold = advantageSigma * normalQuantile(1 - state.positive / 100);
        const forcedPositive = state.sampleType === &#x27;correction&#x27; &amp;&amp; state.correctionsPositive;
        const binaryPositive = forcedPositive || advantage &gt;= threshold - 1e-12;

        $(&#x27;#rw-current-value-label&#x27;).textContent = fmt(currentV);
        $(&#x27;#rw-future-value-label&#x27;).textContent = fmt(futureV);
        $(&#x27;#rw-short-reward-label&#x27;).textContent = fmt(shortR);
        $(&#x27;#rw-uncertainty-label&#x27;).textContent = sigma.toFixed(2);
        const terminalFuture = endpoint === 100 &amp;&amp; Math.abs(futureV) &lt; 1e-12;
        const probabilityCeiling = Math.max(currentDistribution.peak, terminalFuture ? 0 : futureDistribution.peak);
        $(&#x27;#rw-current-path&#x27;).setAttribute(&#x27;d&#x27;, probabilityPath(currentDistribution, probabilityCeiling));
        $(&#x27;#rw-future-path&#x27;).setAttribute(&#x27;d&#x27;, probabilityPath(futureDistribution, probabilityCeiling));
        $(&#x27;#rw-future-path&#x27;).style.display = terminalFuture ? &#x27;none&#x27; : &#x27;&#x27;;
        $(&#x27;#rw-probability-scale&#x27;).textContent = `桶概率 · 峰高 ${(probabilityCeiling * 100).toFixed(1)}%`;
        const shapeDescriptions = {
          normal: &#x27;标准单峰&#x27;, narrow: &#x27;窄单峰&#x27;, wide: &#x27;宽单峰&#x27;,
          &#x27;left-tail&#x27;: &#x27;左侧较差回报有长尾&#x27;, &#x27;right-tail&#x27;: &#x27;右侧较好回报有长尾&#x27;,
          bimodal: &#x27;概率集中在两个峰&#x27;, uniform: &#x27;有限区间内近似均匀&#x27;
        };
        $(&#x27;#rw-shape-detail&#x27;).textContent = shapeDescriptions[state.distributionShape] +
          `；当前实际标准差 ${currentDistribution.standardDeviation.toFixed(3)}。保持期望比较形状，靠近边界时压缩分布。`;
        $(&#x27;#rw-current-path&#x27;).setAttribute(&#x27;aria-label&#x27;, `当前分布：概率和 1，期望 ${fmt(currentV)}`);
        $(&#x27;#rw-future-path&#x27;).setAttribute(&#x27;aria-label&#x27;, `未来分布：概率和 1，期望 ${fmt(futureV)}`);
        const currentX = scaleX(currentV, -1, 0, 56, 470);
        const futureX = scaleX(futureV, -1, 0, 56, 470);
        $(&#x27;#rw-current-mean&#x27;).setAttribute(&#x27;x1&#x27;, currentX);
        $(&#x27;#rw-current-mean&#x27;).setAttribute(&#x27;x2&#x27;, currentX);
        $(&#x27;#rw-future-mean&#x27;).setAttribute(&#x27;x1&#x27;, futureX);
        $(&#x27;#rw-future-mean&#x27;).setAttribute(&#x27;x2&#x27;, futureX);
        $(&#x27;#rw-current-series-label&#x27;).setAttribute(&#x27;x&#x27;, Math.max(96, Math.min(430, currentX)));
        $(&#x27;#rw-future-series-label&#x27;).setAttribute(&#x27;x&#x27;, Math.max(96, Math.min(430, futureX)));
        $(&#x27;#rw-value-expectation&#x27;).textContent = `Σpₖzₖ：当前 ${fmt(currentV)}，未来 ${fmt(futureV)}`;
        $(&#x27;#rw-future-series-label&#x27;).textContent = terminalFuture ? &#x27;终止态 V=0&#x27; : `未来 V(${endpoint})`;

        $(&#x27;#rw-adv-path&#x27;).setAttribute(&#x27;d&#x27;, densityPath(0, advantageSigma, -1, 1, 540, 954, 40, 230));
        const thresholdX = scaleX(threshold, -1, 1, 540, 954);
        const advantageX = scaleX(advantage, -1, 1, 540, 954);
        $(&#x27;#rw-threshold-line&#x27;).setAttribute(&#x27;x1&#x27;, thresholdX);
        $(&#x27;#rw-threshold-line&#x27;).setAttribute(&#x27;x2&#x27;, thresholdX);
        $(&#x27;#rw-adv-marker&#x27;).setAttribute(&#x27;x1&#x27;, advantageX);
        $(&#x27;#rw-adv-marker&#x27;).setAttribute(&#x27;x2&#x27;, advantageX);
        $(&#x27;#rw-threshold-text&#x27;).setAttribute(&#x27;x&#x27;, Math.min(905, thresholdX + 8));
        $(&#x27;#rw-threshold-text&#x27;).textContent = `ε = ${fmt(threshold)}`;
        $(&#x27;#rw-adv-text&#x27;).setAttribute(&#x27;x&#x27;, advantageX);
        $(&#x27;#rw-adv-text&#x27;).textContent = `A = ${fmt(advantage)}`;
        $(&#x27;#rw-binary-caption&#x27;).textContent = forcedPositive
          ? &#x27;人工纠正覆盖阈值 → Advantage: positive&#x27;
          : `A ${advantage &gt;= threshold ? &#x27;≥&#x27; : &#x27;&lt;&#x27;} ε → Advantage: ${binaryPositive ? &#x27;positive&#x27; : &#x27;negative&#x27;}`;
        $(&#x27;#rw-formula-values&#x27;).textContent = `= ${fmt(shortR)} + (${fmt(futureV)}) − (${fmt(currentV)}) = ${fmt(advantage)}`;
        $(&#x27;#rw-binary-badge&#x27;).textContent = binaryPositive ? &#x27;positive · 1&#x27; : &#x27;negative · 0&#x27;;
        $(&#x27;#rw-binary-reason&#x27;).textContent = forcedPositive
          ? &#x27;人工纠正按 RECAP 规则强制为正&#x27;
          : `当前样本${advantage &gt;= threshold ? &#x27;达到&#x27; : &#x27;低于&#x27;}阈值 ${fmt(threshold)}`;

        $$(&#x27;[data-stage]&#x27;).forEach((g) =&gt; {

  const parseState = (serializedState) => {
    if (
      typeof serializedState !== "string" ||
      new TextEncoder().encode(serializedState).length > 16 * 1024
    ) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    /** @type {unknown} */
    const state = JSON.parse(serializedState);
    if (
      state == null ||
      typeof state !== "object" ||
      Array.isArray(state) ||
      ("imageIds" in state &&
        (!Array.isArray(state.imageIds) || state.imageIds.length > 0))
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }
    const storedState = { modelContent: null, privateContent: null, ...state };
    const canonicalState = JSON.stringify(
      storedState,
      (_key, /** @type {unknown} */ value) => {
        if (typeof value === "number" && !Number.isFinite(value)) {
          throw new TypeError("Widget state must contain finite numbers");
        }
        return value;
      },
    );
    if (new TextEncoder().encode(canonicalState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    return storedState;
  };
  let storage = null;
  let state = null;
  try {
    const localStorage = globalThis.localStorage;
    const probeKey = `${storageKey}:probe`;
    localStorage.setItem(probeKey, "1");
    localStorage.removeItem(probeKey);
    storage = localStorage;
    const savedState = storage.getItem(storageKey);
    if (savedState != null) {
      try {
        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }
    }
  } catch {
    storage = null;
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
</script>
<script>
window.addEventListener('message', (event) => {
  const frame = document.getElementById('codex-visualization');
  if (event.source !== frame.contentWindow || event.data?.type !== 'recap-theme') return;
  const theme = event.data.theme;
  if (theme !== 'light' && theme !== 'dark') return;
  document.documentElement.style.colorScheme = theme;
  document.documentElement.style.background = theme === 'dark' ? '#171119' : '#fffafd';
});
</script></body>
</html>
